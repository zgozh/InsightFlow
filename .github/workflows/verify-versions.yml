name: Verify Versions

# Reusable workflow: checks that every project version source agrees with the
# git tag that triggered the release. Called by container.yaml on v* tags so a
# forgotten version bump blocks the entire release.
#
# Phase 5 删除了 Helm chart：版本源为 backend/pyproject.toml 与
# frontend/package.json 两处。逻辑在 scripts/verify_versions.sh，可本地运行。

on:
  workflow_call:

jobs:
  verify-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Verify all version sources match tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/verify_versions.sh "$TAG_VERSION"
